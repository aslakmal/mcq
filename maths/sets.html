<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiBook Pro - Unified Sets</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(255, 255, 255, 0.05);
            --highlight: #65eeef;
            --text: #f1f2f6;
            --accent: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #eef2ff, #f0fdf4);
        }
.body{display: flex;
            justify-content: center;
            align-items: center;
            }
        .dashboard {background: #fff;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 24px;
            text-align: center;
            width: 760px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        select {
            background: #334155;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
        }

        .answer-box {
            color: #2196F3;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 1px solid #2196F3;
            min-height: 25px;
        }

        svg {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            margin-bottom: 10px;
            border: none;
        }

        .hl {
            fill: var(--highlight);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .hl.show {
            opacity: 1;
        }

        .base-circle {
            fill: none;
            stroke: #64748b;
            stroke-width: 2;
            pointer-events: none;
        }

        .label-title {
            fill: #FF5722;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .data-point {
            fill: #1a1818;
            font-size: 15px;
            font-family: monospace;
            font-weight: bold;
            animation: popIn 0.4s ease-out forwards;
            transform-origin: center;
            transform-box: fill-box;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 10px;
        }

        .controls button {
            padding: 10px 4px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #00BCD4, #2196F3);
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-gen {
            background: #27ae60 !important;
            grid-column: span 4;
            font-weight: bold;
            height: 45px;
            margin: 5px auto;
            font-size: 0.9rem;
            min-width: 250px;
        }

        .hidden {
            display: none !important;
        }

        #setsvg {
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <button onclick="window.history.length > 1 ? history.back() : window.location.href='/maths.html';"
        onmouseover="this.style.backgroundColor='#e0e0e0'" onmouseout="this.style.backgroundColor='#f8f9fa'" style="
        display: inline-flex;
        align-items: center;
        padding: 8px 16px;
        font-size: 14px;
        font-family: sans-serif;
        color: #333;
        background-color: #f8f9fa;
        border: 1px solid #dcdcdc;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        outline: none;
        height:auto;width:auto;
        margin:5px
      ">
        <span style="margin-right: 8px; font-weight: bold;">←</span> Back
      </button>
      <div class="body">
    <div class="dashboard">
        <div class="header-row">
            <select id="modeSelect" onchange="initMode()">
                <option value="2">උපකුලක 2</option>
                <option value="3">උපකුලක 3</option>
            </select>
        </div>

        <div id="answerArea" class="answer-box">ε = { }</div>

        <svg id="setsvg" viewBox="0 0 500 360">
            <defs>
                <circle id="cA" cx="190" cy="140" r="90" />
                <circle id="cB" cx="310" cy="140" r="90" />
                <circle id="cC" cx="250" cy="220" r="90" />
                <clipPath id="cpA">
                    <use xlink:href="#cA" />
                </clipPath>
                <clipPath id="cpB">
                    <use xlink:href="#cB" />
                </clipPath>
                <clipPath id="cpC">
                    <use xlink:href="#cC" />
                </clipPath>

                <mask id="maskOut">
                    <rect width="100%" height="100%" fill="white" />
                    <use xlink:href="#cA" fill="black" />
                    <use xlink:href="#cB" fill="black" />
                    <use id="maskC" xlink:href="#cC" fill="black" class="hidden" />
                </mask>
                <mask id="mask_AB_noC">
                    <use xlink:href="#cA" fill="white" clip-path="url(#cpB)" />
                    <use xlink:href="#cC" fill="black" />
                </mask>
                <mask id="mask_B_noA">
                    <rect width="100%" height="100%" fill="white" />
                    <use xlink:href="#cA" fill="black" />
                </mask>
            </defs>
            <rect id="reg-ab-no-c" x="0" y="0" width="500" height="360" fill="var(--highlight)" class="hl"
                mask="url(#mask_AB_noC)" />
            <rect id="reg-u" x="5" y="5" width="490" height="350" class="hl" mask="url(#maskOut)" />
            <use id="reg-a" xlink:href="#cA" class="hl" />
            <use id="reg-b" xlink:href="#cB" class="hl" />
            <use id="reg-c" xlink:href="#cC" class="hl" />
            <use id="reg-ab" xlink:href="#cA" class="hl" clip-path="url(#cpB)" />
            <use id="reg-bc" xlink:href="#cB" class="hl" clip-path="url(#cpC)" />
            <use id="reg-ac" xlink:href="#cA" class="hl" clip-path="url(#cpC)" />
            <use id="reg-b-only" xlink:href="#cB" class="hl" mask="url(#mask_B_noA)" />
            <g clip-path="url(#cpC)">
                <use id="reg-abc" xlink:href="#cA" class="hl" clip-path="url(#cpB)" />
            </g>

            <rect x="5" y="5" width="490" height="350" fill="none" stroke="#eee" stroke-width="1" />
            <use xlink:href="#cA" class="base-circle" />
            <use xlink:href="#cB" class="base-circle" />
            <use id="outC" xlink:href="#cC" class="base-circle hidden" />

            <text x="25" y="35" class="label-title" style="font-size: 30px;">ε</text>
            <text x="115" y="80" class="label-title">A</text>
            <text x="375" y="80" class="label-title">B</text>
            <text id="labC" x="245" y="320" class="label-title hidden">C</text>

            <g id="dataGroup"></g>
        </svg>

        <div class="controls" id="btnContainer">
            <button class="btn-gen" onclick="generate()">වෙනත් කුලකයක්</button>
        </div>
    </div>
</div>
    <script>
        let mode = 2;
        let currentData = {};
        let epsilonText = "";
        const svgNS = "http://www.w3.org/2000/svg";

        const coords = {
            'a': [
                { x: 130, y: 130 }, { x: 160, y: 100 },
                { x: 120, y: 160 }, { x: 140, y: 180 } // Added 2 more
            ],
            'b': [
                { x: 370, y: 130 }, { x: 340, y: 100 },
                { x: 380, y: 160 }, { x: 360, y: 180 } // Added 2 more
            ],
            'c': [{ x: 250, y: 290 }, { x: 200, y: 280 }],
            'ab': [
                { x: 250, y: 100 }, { x: 250, y: 120 } // Added 1 more
            ],
            'bc': [{ x: 315, y: 215, x: 300, y: 190 }],
            'ac': [{ x: 180, y: 220 }],
            'abc': [{ x: 250, y: 175 }],
            'u': [
                { x: 460, y: 45 }, { x: 60, y: 300 },
                { x: 60, y: 65 }, { x: 430, y: 300 },
                { x: 250, y: 40 }, { x: 300, y: 330 } // Added 1 more
            ]
        };

        function initMode() {
            mode = parseInt(document.getElementById('modeSelect').value);
            document.getElementById('outC').classList.toggle('hidden', mode === 2);
            document.getElementById('labC').classList.toggle('hidden', mode === 2);
            document.getElementById('maskC').classList.toggle('hidden', mode === 2);
            generate();
        }

        function generate() {
            resetUI();
            var xx = 0;
            const full = Array.from({ length: 12 }, (_, i) => i + 1);
            currentData = { a: [], b: [], c: [], ab: [], ac: [], bc: [], abc: [], u: [] };
            document.getElementById('dataGroup').innerHTML = "";

            const regions = mode === 2 ? ['a', 'b', 'ab', 'u'] : Object.keys(coords);
            const counts = {}; regions.forEach(r => counts[r] = 0);

            full.forEach(num => {
                let rKey = regions[Math.floor(Math.random() * regions.length)];

                // Check if the chosen region (A, B, AB, etc.) has an empty slot
                if (counts[rKey] < coords[rKey].length) {
                    const p = coords[rKey][counts[rKey]];
                    drawText(num, p.x, p.y);
                    currentData[rKey].push(num);
                    counts[rKey]++;
                }
                // If the region is full, try to find space in the Universal (u) area
                else if (counts['u'] < coords['u'].length) {
                    const p = coords['u'][counts['u']];
                    drawText(num, p.x, p.y);
                    currentData['u'].push(num); // Mathematically put it in 'u' since circle was full
                    counts['u']++;
                }
            });
            epsilonText = `ε = { ${full.join(', ')} }`;
            document.getElementById('answerArea').textContent = epsilonText;
            buildButtons();
        }

        function drawText(val, x, y) {
            const t = document.createElementNS(svgNS, "text");
            t.setAttribute("x", x); t.setAttribute("y", y);
            t.setAttribute("class", "data-point"); t.setAttribute("text-anchor", "middle");
            t.textContent = val;
            document.getElementById('dataGroup').appendChild(t);
        }

        function buildButtons() {
            const container = document.getElementById('btnContainer');
            container.querySelectorAll('button:not(.btn-gen)').forEach(b => b.remove());

            let config = [
                { n: 'A', type: 'A' }, { n: 'B', type: 'B' }, { n: 'A ∩ B', type: 'inAB' },
                { n: 'A ∪ B', type: 'unAB' }, { n: "(A ∪ B)'", type: 'comp' }, { n: "A' ∩ B", type: 'b_only' }
            ];
            if (mode === 3) {
                config = [
                    { n: 'A', type: 'A' }, { n: 'B', type: 'B' }, { n: 'C', type: 'C' },
                    { n: 'A ∩ B ∩ C', type: 'inABC' }, { n: 'A ∪ B ∪ C', type: 'unABC' },
                    { n: 'B ∩ C', type: 'inBC' }, { n: "(A ∩ B) ∩ C'", type: 'ab_not_c' }, { n: "(A ∪ B ∪ C)'", type: 'comp' }
                ];
            }
            config.sort(() => Math.random() - 0.5).forEach(c => {
                const b = document.createElement('button');
                b.textContent = c.n;
                b.onclick = () => processAction(c.type, c.n);
                container.appendChild(b);
            });
        }

        function processAction(type, label) {
            resetUI();
            let res = []; let hls = [];
            const d = currentData;

            if (type === 'A') { res = [...d.a, ...d.ab, ...d.ac, ...d.abc]; hls = ['reg-a']; }
            else if (type === 'B') { res = [...d.b, ...d.ab, ...d.bc, ...d.abc]; hls = ['reg-b']; }
            else if (type === 'C') { res = [...d.c, ...d.ac, ...d.bc, ...d.abc]; hls = ['reg-c']; }
            else if (type === 'inAB') { res = [...d.ab, ...d.abc]; hls = ['reg-ab']; }
            else if (type === 'inBC') { res = [...d.bc, ...d.abc]; hls = ['reg-bc']; }
            else if (type === 'inABC') { res = [...d.abc]; hls = ['reg-abc']; }
            else if (type === 'unAB') { res = [...d.a, ...d.b, ...d.ab, ...d.ac, ...d.bc, ...d.abc]; hls = ['reg-a', 'reg-b']; }
            else if (type === 'unABC') { res = [...d.a, ...d.b, ...d.c, ...d.ab, ...d.ac, ...d.bc, ...d.abc]; hls = ['reg-a', 'reg-b', 'reg-c']; }
            else if (type === 'ab_not_c') { res = [...d.ab]; hls = ['reg-ab-no-c']; }
            else if (type === 'comp') { res = [...d.u]; hls = ['reg-u']; }
            else if (type === 'b_only') { res = [...d.b]; hls = ['reg-b-only']; }

            document.getElementById('answerArea').textContent = `${label} = { ${res.sort().join(', ')} }`;
            hls.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('show'); });
        }

        function resetUI() {
            document.querySelectorAll('.hl').forEach(el => el.classList.remove('show'));
            document.getElementById('answerArea').textContent = epsilonText;
        }

        window.onload = initMode;
    </script>
</body>

</html>

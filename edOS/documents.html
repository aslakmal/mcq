<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Downloads</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: var(--card-bg);
      padding: 32px;
      border-radius: calc(var(--radius) * 1.5);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    header {
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .document-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .doc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .doc-item:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .doc-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .doc-icon {
      color: var(--primary-color);
      display: flex;
      align-items: center;
    }

    .doc-title {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background-color: var(--primary-color);
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.875rem;
      border-radius: var(--radius);
      transition: background-color 0.2s ease;
    }

    .download-btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Document Downloads</h1>
      <p>Download official school forms and application templates.</p>
    </header>

    <ul class="document-list">
      
      <!-- Document 1 -->
      <li class="doc-item">
        <div class="doc-info">
          <div class="doc-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <span class="doc-title">Teacher Leave Application</span>
        </div>
        <a href="teacher_leave_application.html" class="download-btn" >Open</a>
      </li>


    </ul>
  </div>

</body>
</html>

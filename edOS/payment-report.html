<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Report</title>
   <style>
        :root {
            --border-color: #e2e8f0;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --bg-page: #f8fafc;
            --primary-color: #2563eb;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-page);
            color: #0f172a;
            margin: 0;
            padding: 1rem;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
            overflow: scroll;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.75rem;
        }
        .btn-group {
            display: inline-flex;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        .btn-group button {
            padding: 7px 14px;
            border: none;
            border-right: 1px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: inherit;
        }
        .btn-group button:last-child {
            border-right: none;
        }
        .btn-group button.active {
            background: var(--primary-color);
            color: #fff;
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .stat-box {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            background: #fff;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 4px;
        }
        .chart-wrap {
            position: relative;
            height: 340px;
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }
        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        th {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
        }
        .back-link {
            text-decoration: none;
            font-size: 14px;
            color: var(--primary-color);
            font-weight: 600;
        }
        .student-cell {
    display: flex;
    align-items: center;
    gap: 8px;
}
.student-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--border-color);
    background: #f1f5f9;
}
.paid-items-sub {
    font-size: 11px;
    color: var(--text-muted);
}
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header-row">
                <div>
                    <h2 style="margin: 0;">Payment Report</h2>
                    <p id="schoolSubtitle" style="margin: 4px 0 0; font-size: 13px; color: var(--text-muted);"></p>
                </div>
                <a id="backToCollectionLink" href="index.html" class="back-link">&larr; Back to Collection</a>
            </div>

            <div class="controls-row">
                <div class="btn-group" role="group" aria-label="Report period">
                    <button type="button" id="btn-weekly" onclick="setPeriod('weekly')">Weekly</button>
                    <button type="button" id="btn-monthly" class="active" onclick="setPeriod('monthly')">Monthly</button>
                    <button type="button" id="btn-yearly" onclick="setPeriod('yearly')">Yearly</button>
                </div>

                <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;">
                    <div>
                        <label for="classFilter" style="font-size: 13px; font-weight: 600; margin-right: 6px;">Class:</label>
                        <select id="classFilter" onchange="onClassFilterChange()" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color);">
                            <option value="ALL">All Classes</option>
                        </select>
                    </div>
                
                    <div>
                        <label for="itemFilter" style="font-size: 13px; font-weight: 600; margin-right: 6px;">Payment For:</label>
                        <select id="itemFilter" onchange="refreshReport()" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color);">
                            <option value="ALL">All</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Total Collected (Selected View)</div>
                <div id="totalAmountStat" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Paid Entries Count</div>
                <div id="paidCountStat" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Pending Entries Count</div>
                <div id="pendingCountStat" class="stat-value">0</div>
            </div>
        </div>

        <div class="card">
            <div class="chart-wrap">
                <canvas id="paymentChart"></canvas>
            </div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Paid Count</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="breakdownTableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="sync.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
    <script>
      
        let cachedStudents = [];
        let currentPeriod = 'monthly'; // 'weekly' | 'monthly' | 'yearly'
        let chartInstance = null;

        document.getElementById('schoolSubtitle').innerText = schoolId ? `School ID: ${schoolId}` : 'All Cached Students';
        if (schoolId) {
            document.getElementById('backToCollectionLink').href = `payments.html?school=${encodeURIComponent(schoolId)}`;
        }

        async function initReport() {
            try {
                if (typeof syncEngine !== 'undefined') {
                    await syncEngine.initIndexedDB();
                    await syncEngine.syncStudents();
                    const localStudents = await syncEngine.getLocalData('students');
                    if (Array.isArray(localStudents) && localStudents.length > 0) {
                        cachedStudents = localStudents;
                    }
                }
            } catch (err) {
                console.warn("Using offline/local data:", err);
            }
            populateItemFilter();
            populateClassFilter();
            refreshReport();
        }

        function getStudentPayments(student) {
            if (!Array.isArray(student.payments)) return [];
            return student.payments
                .filter(item => Array.isArray(item) && item[0])
                .slice(-12)
                .map(item => [
                    String(item[0]),
                    item[1] === 'paid' || item[1] === 'pending' ? item[1] : null,
                    item[1] === 'paid' && item[2] ? Number(item[2]) : null
                ]);
        }

        function populateClassFilter() {
            const select = document.getElementById('classFilter');
            const classes = new Set();
            cachedStudents.forEach(s => {
                const cls = (s.class || s.h || '').trim().toUpperCase();
                if (cls) classes.add(cls);
            });

            const sorted = Array.from(classes).sort();
            select.innerHTML = `<option value="ALL">All Classes</option>` +
                sorted.map(cls => `<option value="${escapeAttr(cls)}">${escapeHtml(cls)}</option>`).join('');
        }

        function setPeriod(period) {
            currentPeriod = period;
            ['weekly', 'monthly', 'yearly'].forEach(p => {
                const btn = document.getElementById(`btn-${p}`);
                if (btn) btn.classList.toggle('active', p === period);
            });
            refreshReport();
        }

        function getBucketKey(timestampMs, period) {
            const d = new Date(timestampMs);
            if (Number.isNaN(d.getTime())) return null;

            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');

            if (period === 'yearly') {
                return `${year}`;
            }
            if (period === 'monthly') {
                return `${year}-${month}`;
            }
            // Weekly: e.g. "2026-11 W3"
            const weekNum = Math.ceil(d.getDate() / 7);
            return `${year}-${month} W${weekNum}`;
        }



        function renderChart(labels, amounts, counts) {
            const ctx = document.getElementById('paymentChart').getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }

            const titleMap = {
                weekly: 'Weekly Collected Amount',
                monthly: 'Monthly Collected Amount',
                yearly: 'Yearly Collected Amount'
            };

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: titleMap[currentPeriod] || 'Collected Amount',
                        data: amounts,
                        backgroundColor: 'rgba(37, 99, 235, 0.75)',
                        borderColor: 'rgb(37, 99, 235)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                afterLabel: (context) => {
                                    const idx = context.dataIndex;
                                    return `Paid records: ${counts[idx] ?? 0}`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        }
                    }
                }
            });
        }

        function getStudentPhoto(student) {
    if (!student.photoUrl) return 'img/user.svg';
    if (typeof getFullCloudinaryUrl === 'function') {
        return getFullCloudinaryUrl(student.photoUrl);
    }
    return student.photoUrl;
}

function refreshReport() {
    const selectedClass = document.getElementById('classFilter').value;
    const selectedItem = document.getElementById('itemFilter').value;
    const filteredStudents = cachedStudents.filter(s => {
        if (selectedClass === 'ALL') return true;
        return (s.class || s.h || '').trim().toUpperCase() === selectedClass;
    });

    // periodKey -> { amount: 0, count: 0, students: Map(studentKey -> { name, photo, count, amount, labels }) }
    const buckets = new Map();
    let totalAmount = 0;
    let paidCount = 0;
    let pendingCount = 0;

    filteredStudents.forEach((s, idx) => {
        const studentKey = String(s.id || s.key || `stu_${idx}`);
        const name = s.name || 'Unnamed Student';
        const photo = getStudentPhoto(s);
        const fee = Number(s.classFee ?? s.C ?? 0) || 0;
        const payments = getStudentPayments(s);

        payments.forEach(([label, status, paidAt]) => {
            const cleanLabel = (label || '').trim().toLowerCase();
if (selectedItem !== 'ALL' && cleanLabel !== selectedItem) {
    return;
}
            if (status === 'pending') {
                pendingCount += 1;
            } else if (status === 'paid' && paidAt) {
                const key = getBucketKey(paidAt, currentPeriod);
                if (!key) return;

                if (!buckets.has(key)) {
                    buckets.set(key, { amount: 0, count: 0, students: new Map() });
                }
                const bucket = buckets.get(key);
                bucket.amount += fee;
                bucket.count += 1;

                if (!bucket.students.has(studentKey)) {
                    bucket.students.set(studentKey, {
                        name,
                        photo,
                        count: 0,
                        amount: 0,
                        labels: []
                    });
                }
                const stuEntry = bucket.students.get(studentKey);
                stuEntry.count += 1;
                stuEntry.amount += fee;
                if (label) stuEntry.labels.push(label);

                totalAmount += fee;
                paidCount += 1;
            }
        });
    });

    const sortedKeys = Array.from(buckets.keys()).sort();
    const amounts = sortedKeys.map(k => buckets.get(k).amount);
    const counts = sortedKeys.map(k => buckets.get(k).count);

    document.getElementById('totalAmountStat').innerText = totalAmount.toLocaleString();
    document.getElementById('paidCountStat').innerText = paidCount.toLocaleString();
    document.getElementById('pendingCountStat').innerText = pendingCount.toLocaleString();

    renderChart(sortedKeys, amounts, counts);
    renderBreakdownTable(sortedKeys, buckets);
}

function renderBreakdownTable(sortedKeys, buckets) {
    const tbody = document.getElementById('breakdownTableBody');
    if (sortedKeys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted); padding:1.5rem;">No paid payment records found for this view.</td></tr>`;
        return;
    }

    const rows = [];
    sortedKeys.forEach(key => {
        const bucket = buckets.get(key);
        const paidStudentsList = Array.from(bucket.students.values());

        // Period title row
        rows.push(`
            <tr style="background: #f1f5f9;">
                <td colspan="3" style="font-weight: 700; font-size: 14px; color: #0f172a; padding-top: 10px; padding-bottom: 10px;">
                    ${escapeHtml(key)}
                </td>
            </tr>
        `);

        // Paid students in this period
        paidStudentsList.forEach(stu => {
            const labelsText = stu.labels.length
                ? `<div class="paid-items-sub">${escapeHtml(stu.labels.join(', '))}</div>`
                : '';
            rows.push(`
                <tr>
                    <td>
                        <div class="student-cell">
                            <img src="${escapeAttr(stu.photo)}" alt="${escapeAttr(stu.name)}" class="student-avatar" onerror="this.src='img/user.svg'">
                            <div>
                                <div style="font-weight: 600;">${escapeHtml(stu.name)}</div>
                                ${labelsText}
                            </div>
                        </div>
                    </td>
                    <td>${stu.count}</td>
                    <td><strong>${stu.amount.toLocaleString()}</strong></td>
                </tr>
            `);
        });

        // Period subtotal row
        rows.push(`
            <tr style="background: #f8fafc;">
                <td style="text-align: right; font-weight: 600;">Subtotal</td>
                <td><strong>${bucket.count}</strong></td>
                <td><strong>${bucket.amount.toLocaleString()}</strong></td>
            </tr>
        `);
    });

    tbody.innerHTML = rows.join('');
}

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function escapeAttr(str) {
            return escapeHtml(str).replace(/'/g, "&#39;");
        }

        initReport();
        function populateItemFilter() {
    const select = document.getElementById('itemFilter');
    if (!select) return;

    const prevValue = select.value || 'ALL';
    const selectedClass = document.getElementById('classFilter')?.value || 'ALL';

    const scopedStudents = cachedStudents.filter(s => {
        if (selectedClass === 'ALL') return true;
        return (s.class || s.h || '').trim().toUpperCase() === selectedClass;
    });

    const itemMap = new Map(); // lowerCaseKey -> originalLabel
    scopedStudents.forEach(s => {
        getStudentPayments(s).forEach(([label]) => {
            const clean = label ? label.trim() : '';
            if (clean) {
                const key = clean.toLowerCase();
                if (!itemMap.has(key)) {
                    itemMap.set(key, clean);
                }
            }
        });
    });

    const sortedItems = Array.from(itemMap.values()).sort((a, b) => a.localeCompare(b));
    select.innerHTML = `<option value="ALL">All</option>` +
        sortedItems.map(item => `<option value="${escapeAttr(item.toLowerCase())}">${escapeHtml(item)}</option>`).join('');

    // Keep previous selection if still available, otherwise default to "ALL"
    if (prevValue !== 'ALL' && Array.from(select.options).some(opt => opt.value === prevValue)) {
        select.value = prevValue;
    } else {
        select.value = 'ALL';
    }
}

function onClassFilterChange() {
    populateItemFilter();
    refreshReport();
}
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Timetable Maker</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #eff6ff;
            --text: #172033;
            --muted: #64748b;
            --border: #e2e8f0;
            --surface: #ffffff;
            --bg: #f1f5f9;
            --success: #16a34a;
            --shadow: 0 10px 30px rgba(15, 23, 42, .07);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 10% 0%, rgba(37, 99, 235, .09), transparent 28%),
                linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
            color: var(--text);
        }

        .container {
            width: min(1180px, calc(100% - 28px));
            margin: 28px auto;
            background: rgba(255, 255, 255, .94);
            border: 1px solid rgba(226, 232, 240, .9);
            border-radius: 22px;
            padding: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .container>h2 {
            margin: 0 0 6px;
            font-size: clamp(24px, 3vw, 32px);
            letter-spacing: -.7px;
            color: var(--text);
        }

        .container>h2::after {
            content: "Build a clean weekly schedule for your classes";
            display: block;
            margin-top: 7px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, minmax(150px, 1fr)) auto;
            gap: 14px;
            margin: 24px 0 26px;
            padding: 18px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 16px;
            align-items: end;
        }

        .controls label {
            display: flex;
            flex-direction: column;
            gap: 7px;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .controls select,
        .controls input {
            width: 100%;
            height: 44px;
            margin: 0;
            padding: 0 13px;
            border: 1px solid #d7dee9;
            border-radius: 11px;
            outline: none;
            background: #fff;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            text-transform: none;
            letter-spacing: 0;
            transition: .2s ease;
        }

        .controls select:focus,
        .controls input:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, .10);
        }

        button {
            height: 44px;
            padding: 0 17px;
            background: var(--primary);
            color: white;
            border: 0;
            border-radius: 11px;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 5px 12px rgba(37, 99, 235, .18);
            transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
        }

        button:hover {
            background: var(--primary-dark);
            box-shadow: 0 8px 18px rgba(37, 99, 235, .22);
        }

        button:active {
            transform: translateY(0);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 16px;
        }

        .period-box {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 17px;
            box-shadow: 0 5px 18px rgba(15, 23, 42, .045);
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }

        .period-box:hover {
            border-color: #cbd5e1;
            box-shadow: 0 12px 25px rgba(15, 23, 42, .08);
        }

        .period-box h4 {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 17px;
            color: var(--text);
            font-size: 15px;
            letter-spacing: -.1px;
        }

        .period-box h4::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 0 5px var(--primary-soft);
        }

        .slot-group {
            margin-bottom: 15px;
        }

        .slot-group:last-child {
            margin-bottom: 0;
        }

        .slot-group label {
            display: block;
            margin-bottom: 7px;
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .custom-dropdown {
            position: relative;
            width: 100%;
        }

        .dropdown-selected {
            min-height: 46px;
            padding: 7px 11px;
            border: 1px solid #dbe2ea;
            border-radius: 11px;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: #334155;
            font-size: 13px;
            transition: .2s ease;
        }

        .dropdown-selected:hover {
            border-color: #b9c6d6;
            background: #f8fafc;
        }

        .dropdown-selected>span:last-child {
            color: #94a3b8;
            font-size: 10px;
            transition: transform .2s ease;
        }

        .dropdown-selected img {
            width: 31px;
            height: 31px;
            border-radius: 50%;
            object-fit: cover;
            background: #f1f5f9;
        }

        .dropdown-options {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #dbe2ea;
            border-radius: 13px;
            max-height: 230px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 18px 40px rgba(15, 23, 42, .14);
            padding: 5px;
            animation: zoomOut .3s cubic-bezier(.16, 1, .3, 1) both;
        }

        .dropdown-option {
            padding: 9px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 9px;
            border: 0;
            transition: background .15s ease;
        }

        .dropdown-option:hover {
            background: #f1f5f9;
        }

        .dropdown-option img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            background: #e2e8f0;
            flex: 0 0 auto;
        }

        .option-infoS {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-direction: row;
            gap: 2px;
        }

        .option-infoT {
            display: flex;
            width: 100%;
            gap: 2px;
            flex-direction: column;
        }

        .option-title {
            color: #1e293b;
            font-weight: 650;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .option-sub {
            color: #94a3b8;
            font-size: 11px;
        }

        .stats-panel {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .stats-panel h3 {
            margin: 0 0 12px;
            font-size: 15px;
            color: #334155;
        }

        #classSubjectStats {
            color: var(--muted);
            font-size: 13px;
        }

        .container>button[onclick="saveCompleteTimetable()"] {
            width: 100%;
            margin-top: 16px;
            background: var(--success) !important;
            box-shadow: 0 6px 16px rgba(22, 163, 74, .18);
        }

        .container>button[onclick="saveCompleteTimetable()"]:hover {
            background: #15803d !important;
            box-shadow: 0 9px 20px rgba(22, 163, 74, .22);
        }

        @media (max-width: 800px) {
            .container {
                width: min(100% - 18px, 700px);
                margin: 9px auto;
                padding: 18px;
                border-radius: 18px;
            }

            .controls {
                grid-template-columns: 1fr 1fr;
            }

            .controls button {
                grid-column: 1 / -1;
            }

            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 560px) {
            .container {
                padding: 14px;
            }

            .container>h2 {
                font-size: 23px;
            }

            .controls {
                grid-template-columns: 1fr;
                padding: 14px;
            }

            .controls button {
                grid-column: auto;
                width: 100%;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .period-box {
                padding: 16px;
            }
        }

        .period-box {
            animation: periodSlideDown .5s cubic-bezier(.16, 1, .3, 1) both;
        }

        @keyframes periodSlideDown {
            0% {
                opacity: 0;
                transform: scale(.78);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes zoomOut {
            0% {
                opacity: 0;
                transform: translateY(2px);
            }

            100% {
                opacity: 1;
                transform: translateY(0px);
            }
        }

        .period-box:has(.dropdown-options[style*="display: block"]) {
            z-index: 100;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Timetable Maker</h2>

        <div class="controls">
            <label>Day:
                <select id="daySelect">
                    <option value="monday">Monday</option>
                    <option value="tuesday">Tuesday</option>
                    <option value="wednesday">Wednesday</option>
                    <option value="thursday">Thursday</option>
                    <option value="friday">Friday</option>
                </select>
            </label>

            <label>Class:
                <input type="text" id="classInput" placeholder="e.g., 1A" value="1A">
            </label>

            <label>Total Periods:
                <input type="number" id="totalPeriods" value="8" min="1" max="12">
            </label>

            <button onclick="loadTimetableInterface()">Submit</button>
        </div>

        <div id="timetableGrid" class="grid">
        </div>

        <button onclick="saveCompleteTimetable()" style="background: #28a745;">Save Timetable</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="sync.js?dcd"></script>
    <script src="js/timetable.js?ds"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID Card Template Manager</title>

  <!-- Google Fonts & FontAwesome Icons (Optional for icons) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Custom ID Card Template CSS -->
  <link rel="stylesheet" href="css/id_templates.css?v5">

  <!-- QRCode.js Library for rendering QR code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Firebase JS SDK (v8 Compatibility Library) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
    .admin-wrapper {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e2e8f0;
    }

    .admin-header h2 {
      margin: 0;
      color: #0f172a;
      font-size: 20px;
    }

    .btn-save {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-save:hover {
      background-color: #1d4ed8;
    }

    select.template-select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      outline: none;
      background: #ffffff;
      color: #334155;
      font-weight: 600;
    }

    .preview-heading {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .card-fields-selector {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  background: #f9f9f9;
  padding: 15px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

.selector-column {
  flex: 1;
}

.selector-column h3 {
  font-size: 14px;
  margin-bottom: 10px;
  color: #333;
  text-transform: uppercase;
}

.checkbox-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
  max-height: 220px;
  overflow-y: auto;
  padding-right: 5px;
}

.checkbox-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
}

.checkbox-item input {
  cursor: pointer;
}
.qr-setting-card {
  background: #f9f9f9;
  padding: 15px;
  border-radius: 8px;
  border: 1px solid #ddd;
  margin-bottom: 20px;
}

.qr-setting-card h3 {
  font-size: 14px;
  margin-bottom: 10px;
  color: #333;
  text-transform: uppercase;
}

.radio-group {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
}

.radio-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  cursor: pointer;
}

.custom-url-container {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.custom-url-container input {
  padding: 8px 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 14px;
  width: 100%;
}

.help-text {
  font-size: 12px;
  color: #666;
}
  </style>
</head>
<body>

  <div class="admin-wrapper">
    <div class="admin-header">
      <h2>ID Card Settings</h2>
      <!-- Button to triggers saveSetting() in Firebase -->
   
    </div>

    <!-- CONTROL BAR: TEMPLATE & COLOR SELECTOR -->
    <div class="template-selector-bar">
      <div class="selector-group">
        <label for="templateSelect">Template Style:</label>
        <select id="templateSelect" class="template-select" onchange="onTemplateChange(this.value)">
          <option value="tpl-modern">Modern Curve</option>
          <option value="tpl-classic">Classic Navy</option>
          <option value="tpl-minimal">Minimal Clean</option>
          <option value="tpl-cyber-dark">Cyber Dark</option>
          <option value="tpl-neo-glass">Neo Glass</option>
          <option value="tpl-wave-css">Wave</option>
          <option value="tpl-two-wave">Two-Wave Frame</option>
          <option value="tpl-multi-wave">Multi-Wave Frame</option>
          <option value="tpl-top-polygons">Top Geometric Polygons</option>
          <option value="tpl-apex-modern">Apex Modern Glass</option>
          <option value="tpl-wave-modern">Wave Mmodern</option>
          <option value="tpl-prism-luxe">Prism Luxe</option>
          <option value="tpl-prism-crystal">Prism Crystal</option>          
        </select>
      </div>

      <div class="selector-group">
        <span>Color Preset:</span>
        <div class="color-palette">
          <div class="color-box color-blue active" onclick="onColorChange('blue')" title="Blue"></div>
          <div class="color-box color-red" onclick="onColorChange('red')" title="Red"></div>
          <div class="color-box color-emerald" onclick="onColorChange('emerald')" title="Emerald"></div>
          <div class="color-box color-purple" onclick="onColorChange('purple')" title="Purple"></div>
          <div class="color-box color-amber" onclick="onColorChange('amber')" title="Amber"></div>
        </div>
      </div>
    </div>

  
    <div class="id-cards-container">
    <!-- ID CARDS PREVIEW CONTAINER -->


<!-- UPDATED ID CARD PREVIEW TEMPLATE -->
<div id="frontCard" class="id-card front-card tpl-modern-blue">
  <div class="card-header">
    <img id="idLogo"> 
    <h3 id="cardSchoolFront">SCHOOL</h3>
  </div>
  
  <div class="photo-container">
    <img id="cardPhoto" alt="Student Photo" src="img/user.svg">
  </div>

  <div class="body_">
    <h4 id="cardName">JOHN DOE</h4>
    <div class="card-badge">STUDENT ID CARD</div>

    <!-- Dynamic Front Details Grid -->
    <div class="front-card-body" id="frontCardBody">
      <!-- Generated dynamically -->
    </div>
  </div>

  <!-- QR Code Section on Front -->
  <div class="qr-wrapper"></div>
</div>

<!-- BACK CARD -->
<div id="backCard" class="id-card back-card tpl-modern-blue">
  <div class="card-header">
    <h3>ADDITIONAL DETAILS</h3>
  </div>

  <!-- Dynamic Back Details Grid -->
  <div class="back-card-body" id="backCardBody">
    <!-- Generated dynamically -->
  </div>

  <div class="qr-container">
    <div id="qrcode"></div>
  </div>
  <div class="back-footer">
    <p>If found, please return to school administration.</p>
  </div>
</div>
    </div>


    <!-- FIELD SELECTION PANEL -->
<div class="card-fields-selector">
  <div class="selector-column">
    <h3>Front Card Display Fields</h3>
    <div id="frontFieldsContainer" class="checkbox-grid"></div>
  </div>
  
  <div class="selector-column">
    <h3>Back Card Display Fields</h3>
    <div id="backFieldsContainer" class="checkbox-grid"></div>
  </div>
</div>

<!-- QR CODE TARGET CONFIGURATION -->
<div class="qr-setting-card">
  <h3>QR Code Target</h3>
  
  <div class="radio-group">
    <label class="radio-label">
      <input type="radio" name="qrType" value="default" checked onchange="toggleCustomUrlInput()">
      <span>Default System Page</span>
    </label>
    
    <label class="radio-label">
      <input type="radio" name="qrType" value="custom" onchange="toggleCustomUrlInput()">
      <span>Custom Website URL</span>
    </label>
  </div>

  <div id="customUrlWrapper" class="custom-url-container" style="display: none;">
    <label for="qrCustomUrl">Custom Target URL:</label>
    <input 
      type="url" 
      id="qrCustomUrl" 
      placeholder="https://yourschoolwebsite.lk" 
      class="form-control"
    >
   </div>
</div>

<button class="btn-save" id="btnSaveFirebase" onclick="saveSetting()">
  Save
</button>
</div>

 <!-- Dependencies -->
 <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
 <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
 <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <!-- Custom Firebase Logic JavaScript -->
  <script src="sync.js?v5"></script>
  <script src="js/id_manager.js?v5"></script>

  <!-- Script initialization helper -->
  <script>
    // Render initial QR Code preview
    window.addEventListener("DOMContentLoaded", () => {
      new QRCode(document.getElementById("qrcode"), {
        text: "ID Sample",
        width: 90,
        height: 90,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      // Automatically fetch saved Firebase settings on page load
      if (typeof getSetting === 'function') {
        getSetting();
      }
    });

    // Handle template changes live in DOM
    function onTemplateChange(templateClass) {
      document.querySelectorAll('.id-card').forEach(card => {
        card.className = card.className.replace(/\btpl-\S+/g, '');
        card.classList.add(templateClass);
      });
    }

    // Handle color preset changes live in DOM
    function onColorChange(colorName) {
      document.querySelectorAll('.id-card').forEach(card => {
        card.setAttribute('data-color', colorName);
      });
      document.querySelectorAll('.color-box').forEach(box => {
        box.classList.toggle('active', box.classList.contains(`color-${colorName}`));
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8faff);
}
.scanner-card {
    width: 100%;
    max-width: 430px;
    padding: 25px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(30, 64, 175, 0.12);
}
.scanner-header { text-align: center; margin-bottom: 22px; }
.scanner-icon {
    width: 62px; height: 62px; margin: 0 auto 14px;
    border-radius: 18px; display: flex; align-items: center;
    justify-content: center; background: #eff6ff; color: #2563eb;
}
.scanner-icon svg { width: 34px; height: 34px; }
.scanner-header h2 { color: #172033; font-size: 24px; margin-bottom: 7px; }
.scanner-header p { color: #718096; font-size: 14px; }

#reader {
    width: 100%; aspect-ratio: 1 / 1; max-height: 380px;
    overflow: hidden; position: relative; background: #0f172a; border-radius: 18px;
}
#reader__scan_region { width: 100% !important; height: 100% !important; display: flex !important; align-items: center; justify-content: center; }
#reader__scan_region video { width: 100% !important; height: 100% !important; object-fit: cover !important; border-radius: 18px !important; }

.scan-status {
    margin-top: 18px; padding: 13px 15px; border-radius: 12px;
    background: #f8fafc; color: #64748b; font-size: 14px; text-align: center;
}
.scan-status.success { background: #ecfdf5; color: #047857; }
.scan-status.error { background: #fef2f2; color: #dc2626; }

.student-card {
    display: none;
    margin-top: 16px;
    padding: 16px;
    border-radius: 14px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
}
.student-card h3 { font-size: 16px; color: #1e293b; margin-bottom: 8px; }
.student-card p { font-size: 14px; color: #475569; margin-bottom: 6px; }
.badge {
    display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold;
}
.badge.paid { background: #d1fae5; color: #065f46; }
.badge.unpaid { background: #fee2e2; color: #991b1b; }

.btn {
    display: block; width: 100%; border: none; outline: none;
    margin-top: 12px; padding: 12px; border-radius: 12px;
    background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
}
.btn:hover { background: #1d4ed8; }
.btn-success { background: #10b981; }
.btn-success:hover { background: #059669; }
.btn-secondary { background: #64748b; }
.btn-secondary:hover { background: #475569; }

@media (max-width: 480px) {
    body { padding: 12px; }
    .scanner-card { padding: 18px; }
}
</style>
</head>
<body>

<div class="scanner-card">
    <div class="scanner-header">
        <div class="scanner-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
                <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
                <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                <rect x="7" y="7" width="4" height="4"/>
                <rect x="13" y="13" width="4" height="4"/>
                <path d="M13 7h4"/>
                <path d="M7 13h4"/>
            </svg>
        </div>
        <h2>Scan QR Code</h2>
        <p>Position student QR code inside scanner</p>
    </div>

    <div id="reader"></div>

    <div id="scanStatus" class="scan-status">Starting camera...</div>

    <div id="studentCard" class="student-card">
        <h3 id="studentName">Student Name</h3>
        <p><strong>School ID:</strong> <span id="lblSchool"></span></p>
        <p><strong>Student ID:</strong> <span id="lblId"></span></p>
        <p><strong>Status:</strong> <span id="lblPaidBadge" class="badge">Checking...</span></p>
        <p><strong>Note:</strong> <span id="lblNote">None</span></p>

        <button id="updateFeeBtn" class="btn btn-success" style="display:none;">Mark Fee as Paid</button>
    </div>

    <button id="scanAgain" class="btn btn-secondary" style="display:none;">Scan Another QR</button>
</div>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>    
<script src="../edOS/sync.js"></script>
<script>
let scanner = null;
let scanFinished = false;
let currentScannedStudent = null;
let currentSchoolId = null;
let currentStudentId = null;

function startScanner() {
    scanFinished = false;
    currentScannedStudent = null;
    currentSchoolId = null;
    currentStudentId = null;

    document.getElementById("scanStatus").className = "scan-status";
    document.getElementById("scanStatus").textContent = "Camera ready — scan a QR code";
    document.getElementById("scanAgain").style.display = "none";
    document.getElementById("studentCard").style.display = "none";
    document.getElementById("reader").innerHTML = "";

    scanner = new Html5Qrcode("reader");
    const isMobile = window.innerWidth <= 480;

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: isMobile ? 210 : 240, height: isMobile ? 210 : 240 }, aspectRatio: 1.0 },
        function(decodedText) {
            if (scanFinished) return;
            scanFinished = true;
            scanner.stop().then(() => processQRCode(decodedText)).catch(() => processQRCode(decodedText));
        },
        function(errorMessage) {}
    ).catch(error => {
        console.error(error);
        document.getElementById("scanStatus").className = "scan-status error";
        document.getElementById("scanStatus").textContent = "Unable to access camera. Please allow permission.";
    });
}

async function processQRCode(data) {
    console.log("QR Data:", data);
    try {
        const url = new URL(data);
        currentSchoolId = url.searchParams.get("school");
        currentStudentId = url.searchParams.get("id");

        if (!currentSchoolId || !currentStudentId) {
            throw new Error("Missing parameters in QR URL");
        }

        document.getElementById("scanStatus").className = "scan-status success";
        document.getElementById("scanStatus").textContent = "QR Scanned Successfully!";
        
        await checkStudentFee(currentSchoolId, currentStudentId);

    } catch (err) {
        console.error(err);
        document.getElementById("scanStatus").className = "scan-status error";
        document.getElementById("scanStatus").textContent = "Invalid student QR code format.";
        document.getElementById("scanAgain").style.display = "block";
    }
}

async function checkStudentFee(schoolId, studentId) {
    try {
        const students = await syncEngine.getLocalData('students');
        const student = students.find(s => 
            (s.school === schoolId || s.schoolId === schoolId) && 
            (s.id === studentId || s.key === studentId)
        );

        if (!student) {
            document.getElementById("scanStatus").className = "scan-status error";
            document.getElementById("scanStatus").textContent = "Student record not found in local database.";
            document.getElementById("scanAgain").style.display = "block";
            return;
        }

        currentScannedStudent = student;
        renderStudentInfo(student);

    } catch (e) {
        console.error("Database read error:", e);
        document.getElementById("scanStatus").className = "scan-status error";
        document.getElementById("scanStatus").textContent = "Error reading local student records.";
        document.getElementById("scanAgain").style.display = "block";
    }
}

function renderStudentInfo(student) {
    document.getElementById("studentName").textContent = student.name || student.fullName || "Unknown Student";
    document.getElementById("lblSchool").textContent = currentSchoolId;
    document.getElementById("lblId").textContent = currentStudentId;
    document.getElementById("lblNote").textContent = student.note || student.remarks || "None";

    const badge = document.getElementById("lblPaidBadge");
    const updateBtn = document.getElementById("updateFeeBtn");

    const isPaid = Number(student.paid) === 1;

    if (isPaid) {
        badge.className = "badge paid";
        badge.textContent = "PAID";
        updateBtn.style.display = "none";
    } else {
        badge.className = "badge unpaid";
        badge.textContent = "NOT PAID";
        updateBtn.style.display = "block";
    }

    document.getElementById("studentCard").style.display = "block";
    document.getElementById("scanAgain").style.display = "block";
}

// Update fee status: Firebase + IndexedDB
document.getElementById("updateFeeBtn").addEventListener("click", async function() {
    if (!currentScannedStudent || !currentSchoolId || !currentStudentId) return;

    const btn = this;
    btn.disabled = true;
    btn.textContent = "Updating...";

    try {
        // 1. Update local student data object
        currentScannedStudent.paid = 1;

        // 2. Update Firebase Realtime Database
        // Assumes 'db' is your initialized Firebase database reference instance
        await db.ref(`schools/${currentSchoolId}/students/${currentStudentId}`).set(currentScannedStudent);

        // 3. Update local IndexedDB / sync engine store
        if (typeof syncEngine.saveLocalData === "function") {
            await syncEngine.saveLocalData('students', currentScannedStudent);
        } else if (typeof syncEngine.updateStudent === "function") {
            await syncEngine.updateStudent(currentScannedStudent);
        }

        // 4. Refresh UI
        renderStudentInfo(currentScannedStudent);
        alert("Fee marked as paid and synced successfully!");

    } catch (err) {
        console.error("Failed to update fee status:", err);
        alert("Failed to update Firebase / local DB. Please check your connection.");
    } finally {
        btn.disabled = false;
        btn.textContent = "Mark Fee as Paid";
    }
});

document.getElementById("scanAgain").addEventListener("click", function() {
    if (scanner) {
        try { scanner.clear(); } catch (e) {}
        scanner = null;
    }
    startScanner();
});

startScanner();
</script>

</body>
</html>

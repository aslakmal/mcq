<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Institute Portal</title>

  <!-- Empty manifest link that we will populate via JS -->
  <link id="dynamic-manifest" rel="manifest" />
  
  <!-- Fallback theme color -->
  <meta name="theme-color" content="#2563eb">

  <script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const instituteKey = params.get('institute') || 'default';

    const instituteConfig = {
      aplus: {
        name: "Aplus Institute Portal",
        shortName: "Aplus",
        themeColor: "#1d4ed8",
        icon: "https://digibook.edu.lk/scan/icon-512.png"
      },
      successpath: {
        name: "SuccessPath Academy",
        shortName: "SuccessPath",
        themeColor: "#059669",
        icon: "https://digibook.edu.lk/scan/icon-512.png"
      },
      default: {
        name: "EduPortal PWA",
        shortName: "EduPortal",
        themeColor: "#2563eb",
        icon: "https://digibook.edu.lk/scan/icon-512.png"
      }
    };

    const config = instituteConfig[instituteKey.toLowerCase()] || {
      name: `${instituteKey.toUpperCase()} Portal`,
      shortName: instituteKey,
      themeColor: "#2563eb",
      icon: "https://digibook.edu.lk/scan/icon-512.png"
    };

    const baseUrl = window.location.origin;
    const currentPath = window.location.pathname;
    const targetUrl = `${baseUrl}${currentPath}?institute=${encodeURIComponent(instituteKey)}`;

    // Construct the Web App Manifest using your exact paths
    const manifest = {
      name: config.name,
      short_name: config.shortName,
      start_url: targetUrl,
      scope: `${baseUrl}${currentPath}`,
      display: "standalone",
      background_color: "#ffffff",
      theme_color: config.themeColor,
      icons: [
        {
          src: "https://digibook.edu.lk/scan/icon-192.png",
          sizes: "192x192",
          type: "image/png",
          purpose: "any maskable"
        },
        {
          src: "https://digibook.edu.lk/scan/icon-512.png",
          sizes: "512x512",
          type: "image/png",
          purpose: "any maskable"
        }
      ]
    };

    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], { type: 'application/json' });
    const manifestURL = URL.createObjectURL(blob);

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('#dynamic-manifest').setAttribute('href', manifestURL);
      
      let themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) {
        themeMeta.setAttribute('content', config.themeColor);
      }
    });
  })();
</script>
</head>
<body>
  <h1>Welcome to the Institute Portal</h1>
  <p>Loading your customized learning environment...</p>
</body>
</html>

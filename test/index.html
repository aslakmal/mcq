<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">EduPortal</title>
  <link id="dynamic-manifest" rel="manifest" href="">
  <meta name="theme-color" content="#2563eb">
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --accent: #10b981;
    --accent-hover: #059669;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --bg: #f8fafc;
    --surface: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0 0 96px 0;
    background: var(--bg);
    color: var(--text-main);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app-container {
    padding: 2rem 1.25rem;
    max-width: 540px;
    margin: 0 auto;
    text-align: center;
  }

  h1#app-school-name {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    color: var(--text-main);
    margin: 0 0 0.25rem 0;
  }

  .app-container > p {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0 0 1.5rem 0;
  }

  /* Primary Scan Action Button */
  .action-btn {
    background: linear-gradient(135deg, var(--accent) 0%, #059669 100%);
    color: #ffffff;
    border: none;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .action-btn:hover {
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
    transform: translateY(-1px);
  }

  .action-btn:active {
    transform: scale(0.98);
  }

  /* Safari / Firefox Manual Install Banner */
  .manual-instructions {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e3a8a;
    padding: 14px 16px;
    border-radius: 12px;
    margin: 0 auto 1.25rem auto;
    font-size: 0.875rem;
    text-align: left;
    line-height: 1.45;
  }

  /* Scanner Viewport */
  #scanner-container {
    width: 100%;
    max-width: 400px;
    margin: 20px auto;
    display: none;
    background: #0f172a;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
    border: 2px solid var(--border);
  }

  #stop-scan-btn {
    background: var(--danger) !important;
    color: white !important;
    border: none !important;
    padding: 10px 20px !important;
    margin: 12px !important;
    border-radius: 10px !important;
    font-weight: 600 !important;
    font-size: 0.9rem !important;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  #stop-scan-btn:hover {
    background: var(--danger-hover) !important;
  }

  /* Saved Students Section */
  .students-list {
    margin-top: 2.25rem;
    text-align: left;
  }

  .students-list h3 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0 0 0.85rem 4px;
    font-weight: 700;
  }

  .student-card {
    display: flex;
    align-items: center;
    background: var(--surface);
    padding: 14px 16px;
    border-radius: 14px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .student-card:hover {
    border-color: #cbd5e1;
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
    transform: translateY(-2px);
  }

  .student-card:active {
    transform: scale(0.99);
  }

  .student-card img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 14px;
    background: #e2e8f0;
    border: 2px solid #f1f5f9;
    flex-shrink: 0;
  }

  .student-card strong {
    display: block;
    font-size: 0.98rem;
    color: var(--text-main);
    font-weight: 600;
  }

  /* Glassmorphic Fixed Bottom Install Bar */
  .fixed-install-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: none;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.06);
    z-index: 1000;
  }

  .fixed-install-btn {
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 10px 22px;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .fixed-install-btn:hover {
    background: var(--primary-hover);
  }

  .fixed-install-btn:active {
    transform: scale(0.97);
  }

  /* Full-Screen Iframe Modal */
  #student-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--surface);
    z-index: 9000;
    display: none;
    overflow: hidden;
  }

  .modal-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 9001;
  }

  #modal-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .close-modal-btn {
    background: #fee2e2;
    color: var(--danger);
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .close-modal-btn:hover {
    background: var(--danger);
    color: #ffffff;
  }

  #student-iframe {
    position: absolute;
    top: 54px;
    left: 0;
    width: 100%;
    height: calc(100% - 54px);
    border: none;
    background: var(--bg);
  }
</style>
</head>
<body>

  <!-- Main Unified App Content -->
  <div class="app-container">
    <h1 style="margin-bottom: 5px;" id="app-school-name">School Portal</h1>
    <p style="color: #6b7280; margin-top: 0;">Student Portal & Scanner</p>

    <!-- Manual Instructions (Fallback for Safari/Firefox) -->
    <div id="manual-instructions" class="manual-instructions" style="display: none;">
      ℹ️ <strong>To install on your home screen:</strong> Tap your browser menu or Share button ➕ and select <strong>"Add to Home Screen"</strong>.
    </div>

    <!-- Scan Button -->
    <button id="start-scan-btn" class="action-btn">📷 Scan Student QR Code</button>

    <!-- QR Scanner Viewport -->
    <div id="scanner-container">
      <div id="reader"></div>
      <button id="stop-scan-btn" style="background: #dc2626; color: white; border: none; padding: 8px 16px; margin: 10px; border-radius: 6px; cursor: pointer;">Cancel Scanning</button>
    </div>

    <!-- Saved Students List (Loaded from IndexedDB) -->
    <div class="students-list">
      <h3>Saved Students (Offline Ready)</h3>
      <div id="students-container">
        <p style="color: #6b7280; font-style: italic;">No students saved yet. Scan a QR code to add.</p>
      </div>
    </div>
  </div>

  <!-- Fixed Bottom Bar for App Installation -->
  <div id="fixed-install-bar" class="fixed-install-bar">
    <div style="text-align: left;">
      <strong style="display: block; font-size: 14px;">Install App</strong>
      <span style="font-size: 12px; color: #6b7280;">Get quick home screen access</span>
    </div>
    <button id="install-btn" class="fixed-install-btn">Install</button>
  </div>

  <!-- Modal View Container with Iframe for student.html -->
  <div id="student-modal">
    <div class="modal-header">
      <strong id="modal-title">Student Profile</strong>
      <button id="close-modal-btn" class="close-modal-btn">✕ Close</button>
    </div>
    <iframe id="student-iframe" src=""></iframe>
  </div>

  <!-- Firebase Compat SDKs (v9.22.0) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <!-- Html5-Qrcode Library for Camera Scanning -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <script>
    // Helper function for busy/loading states
    function setAppBusy(isBusy, message = "Updating...") {
      let overlay = document.getElementById('app-busy-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'app-busy-overlay';
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-family:system-ui,sans-serif;z-index:9999;';
        overlay.innerHTML = `<div style="background:white;color:#1f2937;padding:24px 32px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.2);text-align:center;"><div style="border:4px solid #f3f3f3;border-top:4px solid #2563eb;border-radius:50%;width:36px;height:36px;animation:spin 1s linear infinite;margin:0 auto 12px auto;"></div><p id="busy-msg" style="margin:0;font-weight:600;font-size:16px;"></p></div>`;
        
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);
        document.body.appendChild(overlay);
      }
      overlay.style.display = isBusy ? 'flex' : 'none';
      document.getElementById('busy-msg').innerText = message;
    }

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBTq5fuuBh9Ye5r7exiJFtLjJpQ-9vIY2U",
      authDomain: "school-62c45.firebaseapp.com",
      databaseURL: "https://school-62c45-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "school-62c45",
      storageBucket: "school-62c45.firebasestorage.app",
      messagingSenderId: "213099404706",
      appId: "1:213099404706:web:d65d7ec257c1119f3966fb",
      measurementId: "G-8QG01WT32P"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- IndexedDB Setup ---
    const DB_NAME = "SchoolPWA_DB";
    const STORE_NAME = "students";

    function openIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
            dbInstance.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function getStoredStudents() {
      const dbInstance = await openIndexedDB();
      return new Promise((resolve, reject) => {
        const transaction = dbInstance.transaction(STORE_NAME, "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function renderStudentList() {
      const container = document.getElementById('students-container');
      try {
        const students = await getStoredStudents();
        if (students.length === 0) {
          container.innerHTML = '<p style="color: #6b7280; font-style: italic;">No students saved yet. Scan a QR code to add.</p>';
          return;
        }
        container.innerHTML = students.map(s => `
          <div class="student-card" onclick="openStudentModal('${s.url}')">
            <img src="${getFullCloudinaryUrl(s.photoUrl) || '../edOS/img/user.svg'}" alt="${s.name}" onerror="this.src='https://via.placeholder.com/50'">
            <div style="flex-grow: 1; text-align: left;">
              <strong>${s.name}</strong>
              <div style="font-size: 12px; color: #6b7280;">ID: ${s.id}</div>
            </div>
            <span style="color: #2563eb; font-size: 14px; font-weight: 600;">View ➔</span>
          </div>
        `).join('');
      } catch (err) {
        console.error("Error loading students from IndexedDB", err);
      }
    }

    // --- Open student.html in Iframe Modal with Loading Indicator ---
    const iframe = document.getElementById('student-iframe');

    // Automatically hide loading indicator when iframe finishes loading content
    iframe.addEventListener('load', () => {
      if (document.getElementById('student-modal').style.display === 'block') {
        setAppBusy(false);
      }
    });

    function openStudentModal(url) {
      if (!url || url === 'undefined') {
        alert("Invalid student profile URL.");
        return;
      }
      setAppBusy(true, "Loading student profile...");
      iframe.src = url;
      document.getElementById('student-modal').style.display = 'block';
    }

    window.openStudentModal = openStudentModal;
    window.renderStudentList = renderStudentList;

    // Close Modal Handler
    document.getElementById('close-modal-btn').addEventListener('click', () => {
      iframe.src = ''; 
      document.getElementById('student-modal').style.display = 'none';
      renderStudentList();
    });

    // --- Main PWA Logic ---
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const schoolId = params.get('id') || 'default';

      let schoolName = `${schoolId.toUpperCase()} Portal`;
      let themeColor = "#2563eb";

      try {
        const snapshot = await db.ref(`schools/${schoolId}/details/schoolName`).once('value');
        if (snapshot.exists() && snapshot.val()) {
          schoolName = snapshot.val();
        }
      } catch (error) {
        console.error("Error fetching school name from Firebase:", error);
      }

      const setText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.innerText = text;
      };

      setText('page-title', schoolName);
      setText('app-school-name', schoolName);

      renderStudentList();

      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

      const baseUrl = window.location.origin;
      const currentPath = window.location.pathname;
      const targetUrl = `${baseUrl}${currentPath}?id=${encodeURIComponent(schoolId)}`;

      const manifest = {
        name: schoolName,
        short_name: schoolName,
        start_url: targetUrl,
        scope: `${baseUrl}${currentPath}`,
        display: "standalone",
        background_color: "#ffffff",
        theme_color: themeColor,
        icons: [
          { src: "https://digibook.edu.lk/scan/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
          { src: "https://digibook.edu.lk/scan/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
        ],
        related_applications: [
          { platform: "webapp", url: targetUrl }
        ]
      };

      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], { type: 'application/json' });
      const manifestURL = URL.createObjectURL(blob);
      document.querySelector('#dynamic-manifest').setAttribute('href', manifestURL);

      const fixedInstallBar = document.getElementById('fixed-install-bar');
      const installBtn = document.getElementById('install-btn');
      const manualInstructions = document.getElementById('manual-instructions');

      const supportsCustomInstall = 'onbeforeinstallprompt' in window;
      const isInstalled = localStorage.getItem(`pwa_installed_${schoolId}`) === 'true';

      if (!isStandalone && !supportsCustomInstall) {
        if (manualInstructions) manualInstructions.style.display = 'block';
      }

      // --- QR Code Scanner Integration ---
      let html5QrCode = null;
      const startScanBtn = document.getElementById('start-scan-btn');
      const stopScanBtn = document.getElementById('stop-scan-btn');
      const scannerContainer = document.getElementById('scanner-container');

      startScanBtn.addEventListener('click', () => {
        scannerContainer.style.display = 'block';
        startScanBtn.style.display = 'none';

        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          async (decodedText) => {
            await stopScanner();
            openStudentModal(decodedText);
          },
          (errorMessage) => {}
        ).catch(err => {
          console.error("Unable to start scanning.", err);
          alert("Camera permission denied or unavailable.");
          startScanBtn.style.display = 'inline-block';
          scannerContainer.style.display = 'none';
        });
      });

      async function stopScanner() {
        if (html5QrCode) {
          try {
            await html5QrCode.stop();
            html5QrCode.clear();
          } catch (e) {
            console.error("Failed to clear scanner", e);
          }
        }
        scannerContainer.style.display = 'none';
        startScanBtn.style.display = 'inline-block';
      }

      stopScanBtn.addEventListener('click', stopScanner);

      // Install prompt handling
      let deferredPrompt;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        if (!isStandalone && !isInstalled) {
          if (fixedInstallBar) fixedInstallBar.style.display = 'flex';
        }
      });

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            setAppBusy(true, "Installing app, please wait...");
            
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            
            if (outcome !== 'accepted') {
              setAppBusy(false);
            }
            deferredPrompt = null;
          }
        });
      }

      window.addEventListener('appinstalled', () => {
        setAppBusy(false);
        localStorage.setItem(`pwa_installed_${schoolId}`, 'true');
        if (fixedInstallBar) fixedInstallBar.style.display = 'none';
      });
    })();

    function getFullCloudinaryUrl(relativePath) {
  const CLOUDINARY_BASE = "https://res.cloudinary.com/vmorkfqp/image/upload/";
  if (!relativePath) return '';
  if (relativePath.startsWith('http')) return relativePath; // Fallback if full URL was passed

  return `${CLOUDINARY_BASE}${relativePath}`;
}
  </script>
</body>
</html>

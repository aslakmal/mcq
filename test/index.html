<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">EduPortal</title>
  <link id="dynamic-manifest" rel="manifest" href="">
  <meta name="theme-color" content="#2563eb">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    /* Hidden by default until environment check runs */
    .browser-view, .app-view { display: none; padding: 2rem; text-align: center; }
    .install-btn {
      background: #2563eb; color: white; border: none; padding: 12px 24px;
      font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 20px;
    }
    .ios-instructions { background: #f3f4f6; padding: 15px; border-radius: 8px; margin-top: 20px; display: inline-block; text-align: left; }
  </style>
</head>
<body>

  <!-- Browser Landing View (Shown only on web browser) -->
  <div id="browser-view" class="browser-view">
    <h1 id="landing-school-name">Loading School Portal...</h1>
    <p>Install our app for the best experience.</p>
    
    <!-- Custom Install Button (Android / Desktop Chrome/Edge) -->
    <button id="install-btn" class="install-btn" style="display: none;">Install App</button>

    <!-- Apple / iOS Instructions -->
    <div id="ios-instructions" class="ios-instructions" style="display: none;">
      <p><strong>To install on your Apple device:</strong></p>
      <ol style="margin: 0; padding-left: 20px;">
        <li>Tap the <strong>Share</strong> button in Safari</li>
        <li>Select <strong>"Add to Home Screen"</strong> ➕</li>
      </ol>
    </div>
  </div>

  <!-- App Main Content View (Shown only when opened as installed PWA) -->
  <div id="app-view" class="app-view">
    <h1>Welcome to <span id="app-school-name">Portal</span></h1>
    <p>Your portal is running as an installed app.</p>
  </div>

  <!-- Firebase Compat SDKs (v9.22.0) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // Your exact Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBTq5fuuBh9Ye5r7exiJFtLjJpQ-9vIY2U",
      authDomain: "school-62c45.firebaseapp.com",
      databaseURL: "https://school-62c45-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "school-62c45",
      storageBucket: "school-62c45.firebasestorage.app",
      messagingSenderId: "213099404706",
      appId: "1:213099404706:web:d65d7ec257c1119f3966fb",
      measurementId: "G-8QG01WT32P"
    };

    let userID = null;
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    // Run PWA & School Logic safely inside an IIFE
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const schoolId = params.get('id') || 'default';

      let schoolName = `${schoolId.toUpperCase()} Portal`;
      let themeColor = "#2563eb";

      // Fetch school name from Firebase using compat syntax (.once('value'))
      try {
        const snapshot = await db.ref(`schools/${schoolId}/details/schoolName`).once('value');
        if (snapshot.exists() && snapshot.val()) {
          schoolName = snapshot.val();
        }
      } catch (error) {
        console.error("Error fetching school name from Firebase:", error);
      }

      // Safe DOM text setter helper
      const setText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.innerText = text;
      };

      setText('page-title', schoolName);
      setText('landing-school-name', schoolName);
      setText('app-school-name', schoolName);

      // Check if running as Standalone PWA
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

      if (isStandalone) {
        const appView = document.getElementById('app-view');
        if (appView) appView.style.display = 'block';
      } else {
        const browserView = document.getElementById('browser-view');
        if (browserView) browserView.style.display = 'block';
      }

      // Dynamically Build Manifest
      const baseUrl = window.location.origin;
      const currentPath = window.location.pathname;
      const targetUrl = `${baseUrl}${currentPath}?id=${encodeURIComponent(schoolId)}`;

      const manifest = {
        name: schoolName,
        short_name: schoolName.split(' ')[0],
        start_url: targetUrl,
        scope: `${baseUrl}${currentPath}`,
        display: "standalone",
        background_color: "#ffffff",
        theme_color: themeColor,
        icons: [
          {
            src: "https://digibook.edu.lk/scan/icon-192.png",
            sizes: "192x192",
            type: "image/png",
            purpose: "any maskable"
          },
          {
            src: "https://digibook.edu.lk/scan/icon-512.png",
            sizes: "512x512",
            type: "image/png",
            purpose: "any maskable"
          }
        ]
      };

      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], { type: 'application/json' });
      const manifestURL = URL.createObjectURL(blob);
      
      const dynamicManifest = document.querySelector('#dynamic-manifest');
      if (dynamicManifest) dynamicManifest.setAttribute('href', manifestURL);

      let themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) {
        themeMeta.setAttribute('content', themeColor);
      }

      // Handle Install Prompt (Android / Desktop Chrome/Edge)
      let deferredPrompt;
      const installBtn = document.getElementById('install-btn');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = 'inline-block';
      });

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
              installBtn.style.display = 'none';
            }
            deferredPrompt = null;
          }
        });
      }

      // Handle Apple / iOS Device Detection
      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isInStandaloneMode = window.navigator.standalone;

      if (isIos && !isInStandaloneMode) {
        const iosInstructions = document.getElementById('ios-instructions');
        if (iosInstructions) iosInstructions.style.display = 'block';
      }
    })();
  </script>
</body>
</html>

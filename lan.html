<html>
  <head>
    <style>
      /* Hide Google Translate top banner frame */
.goog-te-banner-frame {
    display: none !important;
}
body {
    top: 0px !important;
}
/* Hide "Powered by Google" image */
.goog-te-gadget img {
    display: none !important;
}
    </style>
  </head>
  <body>
    <!-- Container for Google Translate dropdown -->
<div id="google_translate_element"></div>
    <script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'auto', // your source language (e.g. 'si', 'ta', or 'auto')
      includedLanguages: 'en,si,ta', // restrict to target languages you want
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
      autoDisplay: false
    }, 'google_translate_element');
  }
</script>
<script type="text/javascript" 
  src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>
  </body>
</html>

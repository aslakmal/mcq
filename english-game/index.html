<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>english ඉගෙන ගනිමු - පාඩම් සහ සෙල්ලම්</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700;800&family=Noto+Sans+english:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%);
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --primary-dark: #1d4ed8;
      --accent: #f59e0b;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #e11d48;
      --danger-bg: #ffe4e6;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-sm: 0 4px 12px rgba(37, 99, 235, 0.08);
      --shadow-md: 0 10px 25px rgba(37, 99, 235, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans Sinhala', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Header & Top Tabs */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      padding: 14px 16px;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
    }

    .header-inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .app-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .top-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #e2e8f0;
      padding: 5px;
      border-radius: 999px;
      gap: 6px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 10px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transform: scale(1.02);
    }

    /* Main Container */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 5px;
    }

    .tab-section {
      display: none;
    }

    .tab-section.active {
      display: block;
    }

    /* Category Pills */
    .category-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 6px 2px 14px;
      scrollbar-width: none;
    }

    .category-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      flex: 0 0 auto;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-main);
      padding: 9px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .cat-pill:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .cat-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    /* Word List & Zoom-In Animation */
    .word-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }

    @keyframes zoomInPop {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(12px);
      }
      70% {
        opacity: 1;
        transform: scale(1.02) translateY(0);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .word-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      opacity: 0;
      animation: zoomInPop 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .word-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .word-header:hover {
      background: #f8fafc;
    }

    .word-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .word-emoji {
      font-size: 2rem;
      width: 48px;
      height: 48px;
      background: var(--primary-light);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .word-sinhala {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .arrow-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
      flex-shrink: 0;
    }

    .word-card.open .arrow-icon {
      transform: rotate(180deg);
      background: var(--primary-light);
    }

    /* Smooth Dropdown */
    .word-dropdown {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      background: #f8fafc;
    }

    .word-card.open .word-dropdown {
      grid-template-rows: 1fr;
    }

    .dropdown-inner {
      overflow: hidden;
    }

    .dropdown-content {
      padding: 14px 18px 18px;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .english-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .english-word {
      font-family: 'Noto Sans english', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .phonetic-word {
      font-size: 1.05rem;
      font-weight: 600;
      color: #475569;
    }

    .speak-btn {
      border: none;
      background: var(--primary);
      color: #ffffff;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: transform 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .speak-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.08);
    }

    .speak-btn:active {
      transform: scale(0.94);
    }

    /* ================= GAME TAB ================= */
    .game-box {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 14px 10px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .game-intro-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .game-intro-sub {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 22px;
    }

    .level-cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .level-btn {
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      padding: 16px 20px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .level-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .lvl-1 { background: #dcfce7; color: #166534; border-color: #86efac; }
    .lvl-2 { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    .lvl-3 { background: #ffe4e6; color: #9f1239; border-color: #fda4af; }

    .lvl-info h3 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .lvl-info p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .lvl-badge {
      font-size: 1.8rem;
    }

    /* Active Quiz Screen */
    .quiz-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .q-counter {
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .timer-badge {
      background: #fef3c7;
      color: #b45309;
      padding: 6px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #22c55e, #eab308);
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    .question-card {
      background: #f0f9ff;
      border: 2px solid #bae6fd;
      border-radius: var(--radius-md);
      padding: 20px 16px;
      margin-bottom: 18px;
    }

    .q-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 6px;
    }

    .q-prompt {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .q-sub-hint {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .opt-btn {
      border: 2px solid #cbd5e1;
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      transition: all 0.2s;
      font-family: inherit;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f8fafc;
      transform: scale(1.01);
    }

    .opt-btn:disabled {
      cursor: default;
    }

    .opt-english {
      font-family: 'Noto Sans english', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      display: block;
    }

    .opt-phonetic {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .opt-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      animation: gentleBounce 0.45s ease;
    }

    .opt-btn.correct .opt-english {
      color: #14532d;
    }

    .opt-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
    }

    .opt-btn.wrong .opt-english {
      color: #881337;
    }

    @keyframes gentleBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* Friendly Feedback Banner */
 /* Friendly Feedback Modal */
 .feedback-backdrop {
  position: fixed;
    background: rgba(15, 23, 42, 0.35);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease, visibility 0.28s ease;
    bottom: 0;
    width: 100%;
    left: 0;
    }

    .feedback-backdrop.show {
      opacity: 1;
      visibility: visible;
    }

    .feedback-banner {
      width: 100%;
      padding: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      box-shadow: 0 0 8px 7px #0000000a;
      transform: scale(0.82) translateY(16px);
      opacity: 0;
      transition: transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.28s ease;

    }

    .feedback-backdrop.show .feedback-banner {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .feedback-banner.fb-good {
      background: #fff;
      color: #166534;
    }

    .feedback-banner.fb-oops {
    background: #fdfdfd;
    color: #5a5a5a;
    }

    .fb-emoji {
      font-size: 3.4rem;
      line-height: 1;
    }

    .fb-text {
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .next-btn {
      border: none;
      background: var(--primary);
      color: #ffffff;
      padding: 11px 24px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .next-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.04);
    }


    .fb-left {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .fb-emoji {
      font-size: 2.2rem;
      flex-shrink: 0;
    }

    .fb-text {
      font-size: 0.96rem;
      font-weight: 700;
    }

    .next-btn {
      border: none;
      background: var(--primary);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    /* Result Screen */
    .result-emoji {
      font-size: 4.5rem;
      margin-bottom: 10px;
      display: block;
    }

    .score-pill {
      display: inline-block;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary-dark);
      background: var(--primary-light);
      padding: 10px 28px;
      border-radius: 999px;
      margin: 12px 0;
    }

    .motivation-msg {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.6;
      margin-bottom: 24px;
      padding: 0 10px;
    }

    .restart-btn {
      border: none;
      background: var(--primary);
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
    }
    #installBtn {
      display: none; 
    padding: 8px;
    font-size: 16px;
    cursor: pointer;
    position: fixed;
    top: 0;
    z-index: 9;
    left: 0;
    width: 100%;
    border: none;
    color: #fff;
    background: #3F51B5;
    }
  </style>
</head>
<body>
  <button id="installBtn" type="button">Install App</button>
  <header>
    <div class="header-inner">
      <div class="app-title">🌟 ඉංග්‍රීසි ඉගෙන ගනිමු 🌟</div>
      <div class="top-tabs">
        <button class="tab-btn active" id="tab-lessons-btn" onclick="switchTab('lessons')">
          📖 පාඩම්
        </button>
        <button class="tab-btn" id="tab-game-btn" onclick="switchTab('game')">
          🎮 සෙල්ලම් කරමු
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ================= TAB 1: පාඩම් ================= -->
    <section id="lessons-section" class="tab-section active">
      <div class="category-bar" id="category-bar"></div>
      <div class="word-list" id="word-list"></div>
    </section>

    <!-- ================= TAB 2: සෙල්ලම් කරමු ================= -->
    <section id="game-section" class="tab-section">
      <!-- Level Selection -->
      <div id="game-start-view" class="game-box">
        <div class="game-intro-title">🎮 සෙල්ලමෙන් ඉංග්‍රීසි ඉගෙන ගමු!</div>
        <p class="game-intro-sub">ප්‍රශ්න 10කට පිළිතුරු දීලා තරු දිනාගන්න. පහතින් මට්ටමක් තෝරන්න:</p>
        <div class="level-cards">
          <button class="level-btn lvl-1" onclick="startQuiz(1, 15)">
            <div class="lvl-info">
              <h3>Level 1</h3>
              <p>එක් ප්‍රශ්නයකට තත්පර 15ක් ලැබේ</p>
            </div>
            <span class="lvl-badge">🐢</span>
          </button>
          <button class="level-btn lvl-2" onclick="startQuiz(2, 10)">
            <div class="lvl-info">
              <h3>Level 2</h3>
              <p>එක් ප්‍රශ්නයකට තත්පර 7ක් ලැබේ</p>
            </div>
            <span class="lvl-badge">🐇</span>
          </button>
          <button class="level-btn lvl-3" onclick="startQuiz(3, 5)">
            <div class="lvl-info">
              <h3>Level 3</h3>
              <p>එක් ප්‍රශ්නයකට තත්පර 5ක් ලැබේ</p>
            </div>
            <span class="lvl-badge">🚀</span>
          </button>
        </div>
      </div>

      <!-- Active Quiz -->
      <div id="game-quiz-view" class="game-box" style="display: none;">
        <div class="quiz-top-bar">
          <span class="q-counter" id="q-counter">ප්‍රශ්නය 1 / 10</span>
          <span class="timer-badge">⏱️ <span id="timer-text">10</span>s</span>
        </div>
        <div class="timer-track">
          <div class="timer-fill" id="timer-fill"></div>
        </div>

        <div class="question-card">
          <span class="q-emoji" id="q-emoji">🍎</span>
          <div class="q-prompt" id="q-prompt">ඇපල්</div>
      <!--   <div class="q-sub-hint">මෙහි හරි ඉංග්‍රීසි වචනය තෝරන්න 👇</div>--> 
        </div>

        <div class="options-grid" id="options-grid"></div>

         </div>
         <div class="feedback-backdrop" id="feedback-backdrop">
         <div class="feedback-banner" id="feedback-banner">
            <div class="fb-left">
              <span class="fb-emoji" id="fb-emoji">🎉</span>
              <div class="fb-text" id="fb-text">හරිම ලස්සනයි!</div>
            </div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">ඊළඟ ➔</button>
          </div>
        </div>

      <!-- Result Screen -->
      <div id="game-result-view" class="game-box" style="display: none;">
        <span class="result-emoji" id="result-emoji">🏆</span>
        <div class="game-intro-title">සෙල්ලම අවසන්!</div>
        <div class="score-pill" id="final-score">8 / 10</div>
        <p class="motivation-msg" id="motivation-msg"></p>
        <button class="restart-btn" onclick="resetGame()">🔄 නැවත සෙල්ලම් කරමු</button>
      </div>
    </section>
  </main>
  <script src="data.js"></script>
  <script>
    // ==========================================
    // 1. CATEGORIES LIST

    // ==========================================
    // 3. SPEECH SYNTHESIS (english AUDIO)
    // ==========================================
    function speakenglish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = 0.68; // Slightly slower for kids learning

  const voices = window.speechSynthesis.getVoices();
  const chosenVoice =
    voices.find((v) => v.name === 'Google US English') ||
    voices.find((v) => v.lang.startsWith('en'));

  if (chosenVoice) {
    utterance.voice = chosenVoice;
  }

  window.speechSynthesis.speak(utterance);
}

    // ==========================================
    // 6. GAME TAB LOGIC
    // ==========================================
    let quizQuestions = [];
    let currentQIndex = 0;
    let score = 0;
    let timePerQuestion = 10;
    let timeLeft = 10;
    let timerInterval = null;
    let questionAnswered = false;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startQuiz(level, seconds) {
      timePerQuestion = seconds;
      score = 0;
      currentQIndex = 0;

      // Only pick items from categories that have at least 4 items so all 4 options match category
      const validItems = vocabularyData.filter(item => {
        const sameCatCount = vocabularyData.filter(x => x.category === item.category).length;
        return sameCatCount >= 4;
      });

      const selected = shuffleArray(validItems).slice(0, 10);

      quizQuestions = selected.map(correctItem => {
        const distractors = shuffleArray(
          vocabularyData.filter(x => x.category === correctItem.category && x.id !== correctItem.id)
        ).slice(0, 3);

        const options = shuffleArray([correctItem, ...distractors]);
        return {
          question: correctItem,
          options
        };
      });

      document.getElementById('game-start-view').style.display = 'none';
      document.getElementById('game-result-view').style.display = 'none';
      document.getElementById('game-quiz-view').style.display = 'block';

      loadQuestion();
    }

    function loadQuestion() {
      questionAnswered = false;
      const current = quizQuestions[currentQIndex];
      const qItem = current.question;

      document.getElementById('q-counter').textContent = `ප්‍රශ්නය ${currentQIndex + 1} / ${quizQuestions.length}`;

      document.getElementById('q-emoji').textContent = qItem.emoji;
      document.getElementById('q-prompt').textContent = qItem.sinhala;

      hideFeedbackModal();

      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';

      current.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.dataset.id = opt.id;
        btn.innerHTML = `
          <div>
            <span class="opt-english">${opt.english}</span>
            <span class="opt-phonetic">${opt.phonetic}</span>
          </div>
         `;
        btn.onclick = () => handleAnswer(opt, btn);
        grid.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = timePerQuestion;
      const timerText = document.getElementById('timer-text');
      const timerFill = document.getElementById('timer-fill');

      timerText.textContent = timeLeft;
      timerFill.style.width = '100%';
      timerFill.style.background = 'linear-gradient(90deg, #22c55e, #eab308)';

      const stepMs = 100;
      let elapsed = 0;
      const totalMs = timePerQuestion * 1000;

      timerInterval = setInterval(() => {
        elapsed += stepMs;
        const remainingMs = Math.max(0, totalMs - elapsed);
        const pct = (remainingMs / totalMs) * 100;

        timerFill.style.width = `${pct}%`;
        timerText.textContent = Math.ceil(remainingMs / 1000);

        if (pct < 35) {
          timerFill.style.background = '#f97316';
        }

        if (remainingMs <= 0) {
          clearInterval(timerInterval);
          if (!questionAnswered) {
            handleTimeUp();
          }
        }
      }, stepMs);
    }

    function handleAnswer(selectedOpt, clickedBtn) {
      if (questionAnswered) return;
      questionAnswered = true;
      clearInterval(timerInterval);

      const correctOpt = quizQuestions[currentQIndex].question;
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(b => b.disabled = true);

      if (selectedOpt.id === correctOpt.id) {
        score++;
        clickedBtn.classList.add('correct');
        showFeedbackModal('fb-good', '🥳', `හරිම දක්ෂයි! "${correctOpt.sinhala}" කියන්නේ "${correctOpt.phonetic}" කියලා`);
        speakenglish(correctOpt.speechText);
      } else {
        clickedBtn.classList.add('wrong');
        allBtns.forEach(b => {
          if (Number(b.dataset.id) === correctOpt.id) {
            b.classList.add('correct');
          }
        });
        console.log(correctOpt)
        showFeedbackModal('fb-oops', '😢', `අයියෝ! "${correctOpt.sinhala}" කියන්නේ "${correctOpt.phonetic}" කියලා`);
        speakenglish(correctOpt.speechText);
      }

      document.getElementById('next-btn').textContent =
        currentQIndex === quizQuestions.length - 1 ? 'ලකුණු බලමු 🏆' : 'ඊළඟ ➔';
    }

    function handleTimeUp() {
      questionAnswered = true;
      const correctOpt = quizQuestions[currentQIndex].question;
      const allBtns = document.querySelectorAll('.opt-btn');

      allBtns.forEach(b => {
        b.disabled = true;
        if (Number(b.dataset.id) === correctOpt.id) {
          b.classList.add('correct');
        }
      });

      showFeedbackModal('fb-oops', '😢', `වෙලාව ඉවරයි! හරි උත්තරය "${correctOpt.phonetic}"`);
      speakenglish(correctOpt.speechText);

      document.getElementById('next-btn').textContent =
        currentQIndex === quizQuestions.length - 1 ? 'ලකුණු බලමු 🏆' : 'ඊළඟ ➔';
    }

    function nextQuestion() {
        hideFeedbackModal();
      currentQIndex++;
      if (currentQIndex < quizQuestions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('game-quiz-view').style.display = 'none';
      document.getElementById('game-result-view').style.display = 'block';

      const total = quizQuestions.length;
      document.getElementById('final-score').textContent = `${score} / ${total}`;

      const resEmoji = document.getElementById('result-emoji');
      const motMsg = document.getElementById('motivation-msg');

      if (score >= 8) {
        resEmoji.textContent = '🏆';
        motMsg.textContent = 'සුපිරිම දක්ෂයෙක්! ඔයා ඉංග්‍රීසි වචන ගොඩක් හොඳට ඉගෙනගෙන තියෙනවා! 🌟👏';
      } else if (score >= 5) {
        resEmoji.textContent = '🌟';
        motMsg.textContent = 'හොඳ උත්සාහයක්! තව ටිකක් පාඩම් බලලා සෙල්ලම් කළොත් ඔයාට 10න් 10ම ගන්න පුළුවන්! 💪😊';
      } else {
        resEmoji.textContent = '🤗';
        motMsg.textContent = 'දුක් වෙන්න එපා! හැමෝම ඉගෙන ගන්නේ වැරදිලා තමයි. "පාඩම්" වලට ගිහින් වචන ටික අහලා ආයෙත් සෙල්ලම් කරමු! 🌈❤️';
      }
    }

    function resetGame() {
      clearInterval(timerInterval);
      document.getElementById('game-result-view').style.display = 'none';
      document.getElementById('game-quiz-view').style.display = 'none';
      document.getElementById('game-start-view').style.display = 'block';
    }

    // Initialize Page
    renderCategories();
    renderWordList();

    // Helper functions for feedback modal
    function showFeedbackModal(typeClass, emoji, message) {
      const backdrop = document.getElementById('feedback-backdrop');
      const fb = document.getElementById('feedback-banner');
      document.getElementById('fb-emoji').textContent = emoji;
      document.getElementById('fb-text').textContent = message;
      fb.className = `feedback-banner ${typeClass}`;
      backdrop.classList.add('show');
    }

    function hideFeedbackModal() {
      document.getElementById('feedback-backdrop').classList.remove('show');
    }
  </script>

<script>
  // 1. Register Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.error("Service worker registration failed:", err);
      });
    });
  }

  // 2. Custom Install Button Logic
  let deferredPrompt = null;
  const installBtn = document.getElementById("installBtn");

  function isAppInstalled() {
    return (
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true // iOS Safari
    );
  }

  function updateInstallButtonVisibility() {
    if (isAppInstalled() || !deferredPrompt) {
      installBtn.style.display = "none";
    } else {
      installBtn.style.display = "inline-block";
    }
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    // Prevent automatic mini-infobar on supported browsers
    e.preventDefault();
    deferredPrompt = e;
    updateInstallButtonVisibility();
  });

  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;

    installBtn.disabled = true;
    deferredPrompt.prompt();

    const { outcome } = await deferredPrompt.userChoice;
    console.log("Install prompt outcome:", outcome);

    // The prompt can only be used once
    deferredPrompt = null;
      installBtn.disabled = false;
      updateInstallButtonVisibility();
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      updateInstallButtonVisibility();
    });

    window.addEventListener("load", updateInstallButtonVisibility);
  </script>
